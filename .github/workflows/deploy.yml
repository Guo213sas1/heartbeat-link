name: Deploy Heartbeat Link

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: heartbeat-link
        run: npm install

      - name: Build Project
        working-directory: heartbeat-link
        run: npm run build
        env:
          VITE_DUE_DATE: ${{ vars.DEFAULT_DUE_DATE || '2026-08-15' }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./heartbeat-link/dist
